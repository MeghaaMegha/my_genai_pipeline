name: Continuous Integration Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Code Quality & Test Suite Execution
    runs-on: ubuntu-latest

    env:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      PYTHONPATH: ${{ github.workspace }}

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java Runtime Environment (OpenJDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.0.1
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Cache Python Environment Dependencies
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}-v2

    - name: Configure Poetry to Ignore Lockfile Mismatch
      run: poetry config virtualenvs.create true

    - name: Install Environment Dependencies
      run: |
          poetry lock
          poetry install --no-interaction

    - name: Check Code Formatting (Black)
      run: |
          pip install black
          black --check src/ tests/
      continue-on-error: false

    - name: Run Test Suite (Pytest Verification)
      env:
        PYTHONPATH: ${{github.workspace}}
      run: |
          pip install pytest pyspark
          pytest

